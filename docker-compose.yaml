services:
  # 1. MinIO (Storage Layer - using the Chainguard community mirror)
  minio:
    image: cgr.dev/chainguard/minio:latest
    ports:
      - "9000:9000" # API port
      - "9001:9001" # Web Console port
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=password123
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # 2. MongoDB (Serving Database)
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # 3. Zookeeper (Required for Kafka coordination)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # 4. Kafka (Stream Ingestion)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # 5. Spark Master (Processing Engine)
  spark-master:
    image: bitnamilegacy/spark:3.5.0
    environment:
      - SPARK_MODE=master
    ports:
      - "8080:8080" # Spark UI
      - "7077:7077" # Master connection port
    volumes:
      - ./src:/opt/bitnami/spark/src

  # 6. Spark Worker (Processing Nodes)
  spark-worker:
    image: bitnamilegacy/spark:3.5.0
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "8081:8081" # Worker UI
    volumes:
      - ./src:/opt/bitnami/spark/src

# Define persistent storage volumes
volumes:
  minio_data:
  mongo_data: